- ros_topic_name: "/clock"
  gz_topic_name: "/clock"
  ros_type_name: "rosgraph_msgs/msg/Clock"
  gz_type_name: "gz.msgs.Clock"
  direction: "GZ_TO_ROS"


# For every topic you want to bridge, add a new entry in the list above with the appropriate values. The "direction" field can be set to "bidirectional", "ros_to_gz", or "gz_to_ros" depending on your needs.

- ros_topic_name: "/joint_states"
  gz_topic_name: "/world/empty/model/Red_Cherry_Bot/joint_state"
  ros_type_name: "sensor_msgs/msg/JointState"
  gz_type_name: "gz.msgs.Model"
  direction: "GZ_TO_ROS"




- ros_topic_name: "/tf"
  gz_topic_name: "/model/Red_Cherry_Bot/tf"
  ros_type_name: "tf2_msgs/msg/TFMessage"
  gz_type_name: "gz.msgs.Pose_V"
  direction: "GZ_TO_ROS"




- ros_topic_name: "/cmd_vel"
  gz_topic_name: "/model/Red_Cherry_Bot/cmd_vel"
  ros_type_name: "geometry_msgs/msg/Twist"
  gz_type_name: "gz.msgs.Twist"
  direction: "ROS_TO_GZ"


