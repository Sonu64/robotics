- ros_topic_name: "/clock"
  gz_topic_name: "/clock"
  ros_type_name: "rosgraph_msgs/msg/Clock"
  gz_type_name: "gz.msgs.Clock"
  direction: "GZ_TO_ROS"


# For every topic you want to bridge, add a new entry in the list above with the appropriate values. The "direction" field can be set to "bidirectional", "ros_to_gz", or "gz_to_ros" depending on your needs.

- ros_topic_name: "/joint_states"
  gz_topic_name: "/world/default/model/Red_Cherry_Bot/joint_state"
  ros_type_name: "sensor_msgs/msg/JointState"
  gz_type_name: "gz.msgs.Model"
  direction: "GZ_TO_ROS"



- ros_topic_name: "/tf"
  gz_topic_name: "/model/Red_Cherry_Bot/tf"
  ros_type_name: "tf2_msgs/msg/TFMessage"
  gz_type_name: "gz.msgs.Pose_V"
  direction: "GZ_TO_ROS"



- ros_topic_name: "/cmd_vel"
  gz_topic_name: "/model/Red_Cherry_Bot/cmd_vel"
  ros_type_name: "geometry_msgs/msg/Twist"
  gz_type_name: "gz.msgs.Twist"
  direction: "ROS_TO_GZ"

- ros_topic_name: "/camera/image_raw"
  gz_topic_name: "/camera/image_raw"
  ros_type_name: "sensor_msgs/msg/Image"
  gz_type_name: "gz.msgs.Image"
  direction: "GZ_TO_ROS"

- ros_topic_name: "/camera/camera_info"
  gz_topic_name: "/camera/camera_info"
  ros_type_name: "sensor_msgs/msg/CameraInfo"
  gz_type_name: "gz.msgs.CameraInfo"
  direction: "GZ_TO_ROS"



- ros_topic_name: "joint0/cmd_pos" # Self named.
  gz_topic_name: "/model/Red_Cherry_Bot/joint/forearm_joint/0/cmd_pos"
  ros_type_name: "std_msgs/msg/Float64"
  gz_type_name: "gz.msgs.Double"
  direction: "GZ_TO_ROS"


- ros_topic_name: "joint1/cmd_pos" # Self Named. Why ???
  gz_topic_name: "/model/Red_Cherry_Bot/joint/elbow_joint/0/cmd_pos"
  ros_type_name: "std_msgs/msg/Float64"
  gz_type_name: "gz.msgs.Double"
  direction: "GZ_TO_ROS"
